<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Top bar prototype — A…F</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --bar: rgba(28,28,28,0.95); --line: rgba(255,255,255,0.08); --text: #dde3f0; --text2: #c2cadb; --muted: #8b94a8; --dim: #7a7a7a; --blue: #80aaff; --green: #50c878; --amber: #e8c14b; --red: #cc6666; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f1115; color: var(--text2); font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .page { padding: 20px 24px 60px; display: flex; flex-direction: column; gap: 34px; }
  .topbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .topbar .lbl { font-size: 11px; letter-spacing: 1px; color: var(--muted); }
  .btn { padding: 4px 8px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; color: #c0c0c0; font-size: 11px; cursor: pointer; font-family: inherit; }
  .btn:hover { background: rgba(255,255,255,0.12); color: var(--text); } .btn.primary { background: rgba(80,140,255,0.25); }
  .note { color: var(--muted); font-size: 12px; line-height: 1.5; max-width: 900px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin-bottom: 8px; }
  .note b { color: var(--blue); }
  .frame { position: relative; width: 1100px; background: #dfe1e4; border-radius: 6px; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,0.5); }
  .frame .vp { height: 120px; background: linear-gradient(180deg, #e8e9eb, #d8dadd); }
  .bar { position: relative; background: var(--bar); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 48px; font-family: ui-monospace, Menlo, monospace; }
  .sep { width: 1px; height: 22px; background: rgba(255,255,255,0.1); flex-shrink: 0; }
  .sim { display: flex; gap: 8px; align-items: center; margin-top: 8px; color: var(--muted); font-size: 11px; font-family: system-ui, sans-serif; }
  /* shared controls */
  .ib { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; min-width: 28px; padding: 0 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.09); background: transparent; color: var(--dim); font-family: inherit; font-size: 11px; cursor: pointer; white-space: nowrap; position: relative; }
  .ib:hover { color: var(--text); border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.04); }
  .ib.on { color: var(--blue); border-color: rgba(80,140,255,0.6); background: rgba(80,140,255,0.2); }
  .ib.play { color: var(--green); border-color: rgba(80,200,120,0.35); background: rgba(80,200,120,0.08); }
  .ib.play:hover { background: rgba(80,200,120,0.18); }
  .ib.primary { color: #0f1115; background: var(--green); border-color: var(--green); font-weight: 600; font-family: system-ui, sans-serif; }
  .ib.primary:hover { background: #6ad48e; }
  .ib:disabled { opacity: 0.35; cursor: default; }
  .ib:disabled:hover { background: transparent; color: var(--dim); border-color: rgba(255,255,255,0.09); }
  .ib.ghost { border-color: transparent; }
  .ib.ghost:hover { border-color: rgba(255,255,255,0.12); }
  .seg { display: inline-flex; border: 1px solid rgba(255,255,255,0.1); border-radius: 7px; overflow: hidden; background: rgba(255,255,255,0.03); }
  .seg button { height: 26px; min-width: 30px; padding: 0 9px; border: none; background: transparent; color: var(--dim); font-family: inherit; font-size: 11px; cursor: pointer; border-right: 1px solid rgba(255,255,255,0.08); }
  .seg button:last-child { border-right: none; } .seg button:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .seg button.on { color: var(--blue); background: rgba(80,140,255,0.2); }
  .seg .cap { display: inline-flex; align-items: center; padding: 0 8px; color: var(--muted); font-size: 10px; letter-spacing: 1px; border-right: 1px solid rgba(255,255,255,0.08); }
  .brand { color: var(--blue); font-size: 13px; letter-spacing: 2px; opacity: 0.85; white-space: nowrap; }
  .crumb { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .crumb .p { color: var(--blue); cursor: pointer; } .crumb .p:hover { text-decoration: underline; }
  .crumb .s { color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: 6px; border: 1px solid transparent; }
  .crumb .s:hover { border-color: rgba(255,255,255,0.14); background: rgba(255,255,255,0.04); }
  .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 10px; letter-spacing: 0.5px; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px rgba(80,200,120,0.5); }
  .dot.dirty { background: var(--amber); box-shadow: 0 0 6px rgba(232,193,75,0.5); }
  .pop { position: absolute; top: 34px; left: 0; z-index: 20; min-width: 200px; background: rgba(20,22,30,0.98); border: 1px solid rgba(100,160,255,0.25); border-radius: 6px; padding: 4px 0; box-shadow: 0 6px 24px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
  .pop.right { left: auto; right: 0; }
  .pop button, .pop .row { text-align: left; background: none; border: none; color: var(--text2); padding: 6px 12px; font-size: 11px; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .pop button:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .pop .row { cursor: default; color: var(--muted); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; padding-top: 8px; }
  .pop .hr { height: 1px; background: rgba(255,255,255,0.08); margin: 4px 0; }
  .pop button.cur { color: var(--blue); }
  .tab { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 7px 7px 0 0; border: 1px solid rgba(255,255,255,0.08); border-bottom: none; background: rgba(255,255,255,0.03); color: var(--dim); cursor: pointer; font-size: 11px; white-space: nowrap; margin-top: 18px; position: relative; }
  .tab.on { background: rgba(80,140,255,0.12); color: var(--text); border-color: rgba(80,140,255,0.35); }
  .tab:hover { color: var(--text); }
  .kbd { font-size: 9px; color: var(--muted); border: 1px solid rgba(255,255,255,0.12); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  .tip { position: absolute; top: 34px; left: 50%; transform: translateX(-50%); background: rgba(20,22,30,0.98); border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; padding: 3px 7px; font-size: 10px; color: var(--text2); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .1s; z-index: 15; font-family: system-ui, sans-serif; }
  .ib:hover .tip { opacity: 1; }
  .mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #80aaff, #5b7fd6); display: flex; align-items: center; justify-content: center; color: #0f1115; font-weight: 700; font-size: 12px; font-family: system-ui, sans-serif; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 11px; font-family: system-ui, sans-serif; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); color: var(--muted); }
  .pill.dirty { color: var(--amber); border-color: rgba(232,193,75,0.4); background: rgba(232,193,75,0.08); }
  .pill.dirty:hover { background: rgba(232,193,75,0.16); }
  .row2 { height: 34px; background: rgba(22,22,22,0.95); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

// ═══ icons ═══
function Ic({ name, size = 14 }) {
  const p = { width: size, height: size, viewBox: "0 0 16 16", fill: "none", stroke: "currentColor", strokeWidth: 1.5, strokeLinecap: "round", strokeLinejoin: "round" };
  switch (name) {
    case "play": return <svg {...p}><path d="M5 3.5v9l7-4.5z" fill="currentColor" stroke="none" /></svg>;
    case "plus": return <svg {...p}><path d="M8 3.5v9M3.5 8h9" /></svg>;
    case "dots": return <svg {...p}><circle cx="4" cy="8" r="1.2" fill="currentColor" stroke="none" /><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none" /><circle cx="12" cy="8" r="1.2" fill="currentColor" stroke="none" /></svg>;
    case "undo": return <svg {...p}><path d="M6 4 3 7l3 3" /><path d="M3 7h6a4 4 0 0 1 0 8H7" /></svg>;
    case "redo": return <svg {...p}><path d="M10 4l3 3-3 3" /><path d="M13 7H7a4 4 0 0 0 0 8h2" /></svg>;
    case "save": return <svg {...p}><path d="M3 3h8l2 2v8H3z" /><path d="M5 3v4h5V3M5 13V9h6v4" /></svg>;
    case "folder": return <svg {...p}><path d="M2.5 4h4l1.5 1.5h5.5v7h-11z" /></svg>;
    case "file": return <svg {...p}><path d="M4 2.5h5l3 3v8H4z" /><path d="M9 2.5v3h3" /></svg>;
    case "reload": return <svg {...p}><path d="M13 8a5 5 0 1 1-1.5-3.5" /><path d="M13 3v3h-3" /></svg>;
    case "help": return <svg {...p}><circle cx="8" cy="8" r="6" /><path d="M6.2 6.3a1.8 1.8 0 1 1 2.6 1.6c-.6.3-.8.6-.8 1.2M8 11.4v.1" /></svg>;
    case "layers": return <svg {...p}><path d="M8 3 2.5 6 8 9l5.5-3z" /><path d="M2.5 9 8 12l5.5-3" /></svg>;
    case "top": return <svg {...p}><rect x="3" y="3" width="10" height="10" rx="1.5" /><path d="M3 7h10M7 3v10" opacity="0.5" /></svg>;
    case "star": return <svg {...p}><path d="M8 2.5l1.7 3.6 3.9.5-2.8 2.7.7 3.9L8 11.3l-3.5 1.9.7-3.9L2.4 6.6l3.9-.5z" fill="currentColor" stroke="none" /></svg>;
    case "chev": return <svg {...p}><path d="M4.5 6.5 8 10l3.5-3.5" /></svg>;
    case "export": return <svg {...p}><path d="M8 10V3M5 6l3-3 3 3" /><path d="M3 10v3h10v-3" /></svg>;
    case "x": return <svg {...p}><path d="M4 4l8 8M12 4l-8 8" /></svg>;
    case "close": return <svg {...p}><path d="M3 3h10v10H3z" /><path d="M6 6l4 4M10 6l-4 4" /></svg>;
    default: return null;
  }
}

// ═══ shared state: one project, three scenes, floors, dirty/undo ═══
const SCENES = [{ id: "level_1", name: "level_1", entry: true }, { id: "level_2", name: "level_2" }, { id: "hub", name: "hub" }];
function useEditor() {
  const [scene, setScene] = useState("level_1");
  const [floor, setFloor] = useState(0);
  const [dirty, setDirty] = useState(false);
  const [undo, setUndo] = useState(0);
  const [redo, setRedo] = useState(0);
  const [top, setTop] = useState(false);
  const [saved, setSaved] = useState("24m");
  const edit = () => { setDirty(true); setUndo(u => u + 1); setRedo(0); };
  const doUndo = () => { if (undo) { setUndo(u => u - 1); setRedo(r => r + 1); } };
  const doRedo = () => { if (redo) { setRedo(r => r - 1); setUndo(u => u + 1); } };
  const save = () => { setDirty(false); setSaved("just now"); };
  return { scene, setScene, floor, setFloor, dirty, undo, redo, top, setTop, saved, edit, doUndo, doRedo, save };
}
const Sim = ({ e }) => (
  <div className="sim">simulate: <button className="btn" onClick={e.edit}>make an edit</button><button className="btn" onClick={e.save}>save</button>
    <span>· dirty: <b style={{ color: e.dirty ? "var(--amber)" : "var(--green)" }}>{String(e.dirty)}</b> · undo {e.undo} / redo {e.redo}</span></div>
);
const Tip = ({ t, k }) => <span className="tip">{t}{k && <span className="kbd">{k}</span>}</span>;

function SceneMenu({ e, onClose, right }) {
  return (
    <div className={"pop" + (right ? " right" : "")} onMouseLeave={onClose}>
      <div className="row">Scenes</div>
      {SCENES.map(s => <button key={s.id} className={s.id === e.scene ? "cur" : ""} onClick={() => { e.setScene(s.id); onClose(); }}>
        <span style={{ width: 12, display: "inline-flex", color: "var(--amber)" }}>{s.entry && <Ic name="star" size={11} />}</span>{s.name}{s.id === e.scene && <span style={{ marginLeft: "auto", color: "var(--muted)" }}>current</span>}</button>)}
      <div className="hr"></div>
      <button onClick={onClose}><Ic name="plus" size={12} /> New scene…</button>
      <button onClick={onClose}><Ic name="star" size={12} /> Make this the entry scene</button>
      <button onClick={onClose} style={{ color: "var(--red)" }}><Ic name="x" size={12} /> Delete scene…</button>
    </div>
  );
}
function ProjectMenu({ onClose, right }) {
  return (
    <div className={"pop" + (right ? " right" : "")} onMouseLeave={onClose}>
      <div className="row">Project · Platfrom Obby</div>
      <button onClick={onClose}><Ic name="export" size={12} /> Export game…</button>
      <button onClick={onClose}><Ic name="folder" size={12} /> Open project…</button>
      <button onClick={onClose}><Ic name="file" size={12} /> New project…</button>
      <div className="hr"></div>
      <button onClick={onClose}><Ic name="close" size={12} /> Close project</button>
    </div>
  );
}
const FloorSeg = ({ e, cap }) => (
  <div className="seg">{cap && <span className="cap">FLOOR</span>}{["G", "1", "2", "3"].map((f, i) => <button key={f} className={e.floor === i ? "on" : ""} onClick={() => e.setFloor(i)}>{f}</button>)}</div>
);

// ═══ A · Clustered ═══
function BarA() {
  const e = useEditor(); const [sm, setSm] = useState(false); const [pm, setPm] = useState(false);
  return (<div>
    <div className="frame"><div className="bar">
      <span className="brand">SquareDance</span>
      <div className="sep" />
      <div className="crumb" style={{ position: "relative" }}>
        <span className="p" onClick={() => setPm(m => !m)}>Platfrom Obby</span><span>/</span>
        <span className="s" onClick={() => setSm(m => !m)}><span style={{ color: "var(--amber)", display: "inline-flex" }}><Ic name="star" size={10} /></span>{e.scene}<Ic name="chev" size={11} /></span>
        {sm && <SceneMenu e={e} onClose={() => setSm(false)} />}
        {pm && <ProjectMenu onClose={() => setPm(false)} />}
      </div>
      <span className="status"><span className={"dot" + (e.dirty ? " dirty" : "")} />{e.dirty ? "unsaved changes" : `saved ${e.saved} ago`}</span>
      <span style={{ flex: 1 }} />
      <FloorSeg e={e} cap />
      <button className={"ib" + (e.top ? " on" : "")} onClick={() => e.setTop(t => !t)}><Ic name="top" /> Top<Tip t="Top-down view" /></button>
      <div className="sep" />
      <button className="ib ghost" disabled={!e.undo} onClick={e.doUndo}><Ic name="undo" /><Tip t="Undo" k="⌘Z" /></button>
      <button className="ib ghost" disabled={!e.redo} onClick={e.doRedo}><Ic name="redo" /><Tip t="Redo" k="⌘Y" /></button>
      <div className="sep" />
      <button className="ib" onClick={e.save}><Ic name="save" /> Save<Tip t="Save scene" k="⌘S" /></button>
      <button className="ib play"><Ic name="play" /> Play<Tip t="Play project in the runtime shell (saves first)" /></button>
      <button className="ib ghost" onClick={() => setPm(m => !m)}><Ic name="dots" /></button>
    </div><div className="vp" /></div>
    <Sim e={e} />
  </div>);
}

// ═══ B · Command bar ═══
function BarB() {
  const e = useEditor(); const [sm, setSm] = useState(false); const [pm, setPm] = useState(false); const [fm, setFm] = useState(false);
  return (<div>
    <div className="frame"><div className="bar" style={{ gap: 8 }}>
      <span className="mark">S</span>
      <div className="crumb" style={{ position: "relative" }}>
        <span className="p" onClick={() => setPm(m => !m)}>Platfrom Obby</span><span style={{ color: "var(--dim)" }}>›</span>
        <span className="s" onClick={() => setSm(m => !m)}>{e.scene}<span style={{ color: "var(--amber)", display: "inline-flex" }}><Ic name="star" size={10} /></span><Ic name="chev" size={11} /></span>
        {sm && <SceneMenu e={e} onClose={() => setSm(false)} />}
        {pm && <ProjectMenu onClose={() => setPm(false)} />}
      </div>
      <span style={{ flex: 1 }} />
      <div style={{ position: "relative" }}>
        <button className="ib" onClick={() => setFm(m => !m)}><Ic name="layers" /> Floor {["G", "1", "2", "3"][e.floor]}<Ic name="chev" size={11} /></button>
        {fm && <div className="pop" onMouseLeave={() => setFm(false)} style={{ minWidth: 140 }}>
          {["Ground", "Floor 1", "Floor 2", "Floor 3"].map((f, i) => <button key={f} className={e.floor === i ? "cur" : ""} onClick={() => { e.setFloor(i); setFm(false); }}>{f}<span className="kbd">{i}</span></button>)}
        </div>}
      </div>
      <button className={"ib" + (e.top ? " on" : "")} onClick={() => e.setTop(t => !t)}><Ic name="top" /><Tip t="Top-down view" /></button>
      <div className="sep" />
      <button className="ib ghost" disabled={!e.undo} onClick={e.doUndo}><Ic name="undo" /><Tip t="Undo" k="⌘Z" /></button>
      <button className="ib ghost" disabled={!e.redo} onClick={e.doRedo}><Ic name="redo" /><Tip t="Redo" k="⌘Y" /></button>
      <div className="sep" />
      {e.dirty
        ? <span className="pill dirty" onClick={e.save}><span className="dot dirty" /> Unsaved · Save now</span>
        : <span className="pill"><span className="dot" /> Saved {e.saved} ago</span>}
      <button className="ib primary"><Ic name="play" /> Play</button>
      <div style={{ position: "relative" }}>
        <button className="ib ghost" onClick={() => setPm(m => !m)}><Ic name="dots" /></button>
        {pm && <ProjectMenu right onClose={() => setPm(false)} />}
      </div>
    </div><div className="vp" /></div>
    <Sim e={e} />
  </div>);
}

// ═══ C · Scene tabs ═══
function BarC() {
  const e = useEditor(); const [pm, setPm] = useState(false);
  return (<div>
    <div className="frame"><div className="bar" style={{ alignItems: "flex-end", gap: 4, paddingBottom: 0 }}>
      <span className="brand" style={{ alignSelf: "center", marginRight: 8 }}>SquareDance</span>
      <span className="crumb" style={{ alignSelf: "center", marginRight: 6, position: "relative" }}><span className="p" onClick={() => setPm(m => !m)}>Platfrom Obby</span>{pm && <ProjectMenu onClose={() => setPm(false)} />}</span>
      {SCENES.map(s => <span key={s.id} className={"tab" + (s.id === e.scene ? " on" : "")} onClick={() => e.setScene(s.id)}>
        {s.entry && <span style={{ color: "var(--amber)", display: "inline-flex" }}><Ic name="star" size={10} /></span>}{s.name}
        {s.id === e.scene && e.dirty && <span className="dot dirty" title="unsaved" />}
      </span>)}
      <span className="tab" style={{ padding: "0 8px" }} title="New scene"><Ic name="plus" size={12} /></span>
      <span style={{ flex: 1 }} />
      <div style={{ alignSelf: "center", display: "flex", gap: 6, alignItems: "center" }}>
        <FloorSeg e={e} />
        <button className={"ib" + (e.top ? " on" : "")} onClick={() => e.setTop(t => !t)}><Ic name="top" /><Tip t="Top-down view" /></button>
        <div className="sep" />
        <button className="ib ghost" disabled={!e.undo} onClick={e.doUndo}><Ic name="undo" /><Tip t="Undo" k="⌘Z" /></button>
        <button className="ib ghost" disabled={!e.redo} onClick={e.doRedo}><Ic name="redo" /><Tip t="Redo" k="⌘Y" /></button>
        <div className="sep" />
        <button className="ib" onClick={e.save}><Ic name="save" /><Tip t={e.dirty ? "Save (unsaved changes)" : `Saved ${e.saved} ago`} k="⌘S" /></button>
        <button className="ib play"><Ic name="play" /><Tip t="Play project" /></button>
        <button className="ib ghost" onClick={() => setPm(m => !m)}><Ic name="dots" /></button>
      </div>
    </div><div className="vp" /></div>
    <Sim e={e} />
  </div>);
}

// ═══ D · Icon bar ═══
function BarD() {
  const e = useEditor(); const [sm, setSm] = useState(false); const [pm, setPm] = useState(false);
  return (<div>
    <div className="frame"><div className="bar" style={{ gap: 6 }}>
      <span className="mark">S</span>
      <div style={{ position: "relative" }}>
        <button className="ib" onClick={() => setSm(m => !m)} style={{ color: "var(--text)" }}>
          <span style={{ color: "var(--muted)" }}>Platfrom Obby</span><span style={{ color: "var(--dim)" }}>/</span>{e.scene}<span style={{ color: "var(--amber)", display: "inline-flex" }}><Ic name="star" size={10} /></span><Ic name="chev" size={11} />
        </button>
        {sm && <SceneMenu e={e} onClose={() => setSm(false)} />}
      </div>
      <span className="status" style={{ marginLeft: 6 }}><span className={"dot" + (e.dirty ? " dirty" : "")} /></span>
      <span style={{ flex: 1 }} />
      <button className="ib ghost" disabled={!e.undo} onClick={e.doUndo}><Ic name="undo" /><Tip t="Undo" k="⌘Z" /></button>
      <button className="ib ghost" disabled={!e.redo} onClick={e.doRedo}><Ic name="redo" /><Tip t="Redo" k="⌘Y" /></button>
      <div className="sep" />
      <FloorSeg e={e} />
      <button className={"ib ghost" + (e.top ? " on" : "")} onClick={() => e.setTop(t => !t)}><Ic name="top" /><Tip t="Top-down view" /></button>
      <div className="sep" />
      <button className="ib ghost"><Ic name="file" /><Tip t="New world" /></button>
      <button className="ib ghost"><Ic name="folder" /><Tip t="Load…" /></button>
      <button className="ib ghost" onClick={e.save} style={e.dirty ? { color: "var(--amber)" } : undefined}><Ic name="save" /><Tip t={e.dirty ? "Save — unsaved changes" : `Saved ${e.saved} ago`} k="⌘S" /></button>
      <button className="ib ghost"><Ic name="help" /><Tip t="Keyboard shortcuts" k="?" /></button>
      <button className="ib ghost"><Ic name="reload" /><Tip t="Reload editor UI (dev)" /></button>
      <div className="sep" />
      <button className="ib play"><Ic name="play" /><Tip t="Play project" /></button>
      <div style={{ position: "relative" }}>
        <button className="ib ghost" onClick={() => setPm(m => !m)}><Ic name="dots" /></button>
        {pm && <ProjectMenu right onClose={() => setPm(false)} />}
      </div>
    </div><div className="vp" /></div>
    <Sim e={e} />
  </div>);
}

// ═══ E · Two tiers ═══
function BarE() {
  const e = useEditor(); const [sm, setSm] = useState(false); const [pm, setPm] = useState(false);
  return (<div>
    <div className="frame">
      <div className="bar" style={{ height: 38 }}>
        <span className="brand">SquareDance</span>
        <div className="sep" />
        <div className="crumb" style={{ position: "relative" }}>
          <span className="p" onClick={() => setPm(m => !m)}>Platfrom Obby</span><span>/</span>
          <span className="s" onClick={() => setSm(m => !m)}><span style={{ color: "var(--amber)", display: "inline-flex" }}><Ic name="star" size={10} /></span>{e.scene}<Ic name="chev" size={11} /></span>
          {sm && <SceneMenu e={e} onClose={() => setSm(false)} />}
          {pm && <ProjectMenu onClose={() => setPm(false)} />}
        </div>
        <span className="status"><span className={"dot" + (e.dirty ? " dirty" : "")} />{e.dirty ? "unsaved changes" : `saved ${e.saved} ago`}</span>
        <span style={{ flex: 1 }} />
        <button className="ib ghost"><Ic name="file" /> New</button>
        <button className="ib ghost"><Ic name="folder" /> Load</button>
        <button className="ib" onClick={e.save}><Ic name="save" /> Save</button>
        <button className="ib ghost"><Ic name="export" /> Export</button>
        <button className="ib ghost"><Ic name="help" /></button>
      </div>
      <div className="row2">
        <span className="lbl" style={{ fontSize: 10, letterSpacing: 1, color: "var(--muted)" }}>EDITING</span>
        <FloorSeg e={e} cap />
        <button className={"ib" + (e.top ? " on" : "")} style={{ height: 26 }} onClick={() => e.setTop(t => !t)}><Ic name="top" /> Top view</button>
        <div className="sep" style={{ height: 18 }} />
        <button className="ib ghost" style={{ height: 26 }} disabled={!e.undo} onClick={e.doUndo}><Ic name="undo" /> Undo</button>
        <button className="ib ghost" style={{ height: 26 }} disabled={!e.redo} onClick={e.doRedo}><Ic name="redo" /> Redo</button>
        <span style={{ flex: 1 }} />
        <button className="ib primary" style={{ height: 26 }}><Ic name="play" /> Play project</button>
      </div>
      <div className="vp" />
    </div>
    <Sim e={e} />
  </div>);
}


// ═══ F · Command bar + A's Save + "Top" ═══
function BarF() {
  const e = useEditor(); const [sm, setSm] = useState(false); const [pm, setPm] = useState(false); const [fm, setFm] = useState(false);
  return (<div>
    <div className="frame"><div className="bar" style={{ gap: 8 }}>
      <span className="mark">S</span>
      <div className="crumb" style={{ position: "relative" }}>
        <span className="p" onClick={() => setPm(m => !m)}>Platfrom Obby</span><span style={{ color: "var(--dim)" }}>›</span>
        <span className="s" onClick={() => setSm(m => !m)}>{e.scene}<span style={{ color: "var(--amber)", display: "inline-flex" }}><Ic name="star" size={10} /></span><Ic name="chev" size={11} /></span>
        {sm && <SceneMenu e={e} onClose={() => setSm(false)} />}
        {pm && <ProjectMenu onClose={() => setPm(false)} />}
      </div>
      <span className="status"><span className={"dot" + (e.dirty ? " dirty" : "")} />{e.dirty ? "unsaved changes" : `saved ${e.saved} ago`}</span>
      <span style={{ flex: 1 }} />
      <div style={{ position: "relative" }}>
        <button className="ib" onClick={() => setFm(m => !m)}><Ic name="layers" /> Floor {["G", "1", "2", "3"][e.floor]}<Ic name="chev" size={11} /></button>
        {fm && <div className="pop" onMouseLeave={() => setFm(false)} style={{ minWidth: 140 }}>
          {["Ground", "Floor 1", "Floor 2", "Floor 3"].map((f, i) => <button key={f} className={e.floor === i ? "cur" : ""} onClick={() => { e.setFloor(i); setFm(false); }}>{f}<span className="kbd">{i}</span></button>)}
        </div>}
      </div>
      <button className={"ib" + (e.top ? " on" : "")} onClick={() => e.setTop(t => !t)}><Ic name="top" /> Top<Tip t="Top-down view" /></button>
      <div className="sep" />
      <button className="ib ghost" disabled={!e.undo} onClick={e.doUndo}><Ic name="undo" /><Tip t="Undo" k="⌘Z" /></button>
      <button className="ib ghost" disabled={!e.redo} onClick={e.doRedo}><Ic name="redo" /><Tip t="Redo" k="⌘Y" /></button>
      <div className="sep" />
      <button className="ib" onClick={e.save} style={e.dirty ? { color: "var(--amber)", borderColor: "rgba(232,193,75,0.4)" } : undefined}><Ic name="save" /> Save<Tip t={e.dirty ? "Save — unsaved changes" : `Saved ${e.saved} ago`} k="⌘S" /></button>
      <button className="ib primary"><Ic name="play" /> Play</button>
      <div style={{ position: "relative" }}>
        <button className="ib ghost" onClick={() => setPm(m => !m)}><Ic name="dots" /></button>
        {pm && <ProjectMenu right onClose={() => setPm(false)} />}
      </div>
    </div><div className="vp" /></div>
    <Sim e={e} />
  </div>);
}

// ═══ Today (reference) ═══
function BarToday() {
  const sq = { width: 28, height: 28, border: "1px solid rgba(255,255,255,0.08)", borderRadius: 6, background: "transparent", color: "#7a7a7a", fontSize: 12, fontFamily: "inherit", cursor: "pointer" };
  return (<div className="frame"><div className="bar">
    <span className="brand">SquareDance</span>
    <span style={{ color: "#8b94a8", fontSize: 10, letterSpacing: 0.5, lineHeight: 1.2, width: 110 }}>autosaved 24m ago</span>
    <div className="sep" />
    <span style={{ color: "var(--blue)", fontSize: 11, letterSpacing: 1 }}>Platfrom Ob…</span>
    <span style={{ background: "rgba(46,46,46,0.9)", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 6, color: "#c0c0c0", fontSize: 11, padding: "4px 8px" }}>level_1 ★ ⌄</span>
    <button style={{ ...sq, width: 24, height: 24 }}>+</button>
    <button style={{ ...sq, width: 24, height: 24, color: "#50c878", borderColor: "rgba(80,200,120,0.35)", background: "rgba(80,200,120,0.08)" }}>▶</button>
    <button style={{ ...sq, width: 24, height: 24 }}>⋯</button>
    <div className="sep" />
    <span style={{ color: "#7a7a7a", fontSize: 11, letterSpacing: 1 }}>FLOOR</span>
    {["G", "1", "2", "3"].map((f, i) => <button key={f} style={{ ...sq, ...(i === 0 ? { color: "#80aaff", borderColor: "rgba(80,140,255,0.6)", background: "rgba(80,140,255,0.2)" } : {}) }}>{f}</button>)}
    <div className="sep" />
    <button style={{ ...sq, width: "auto", padding: "0 8px", fontSize: 11, letterSpacing: 1 }}>TOP</button>
    <div className="sep" />
    <button style={sq}>?</button><button style={{ ...sq, background: "rgba(255,255,255,0.07)", border: "none", color: "#9090b0" }}>↻</button>
    <button style={{ ...sq, border: "none", opacity: 0.35 }}>↩</button><button style={{ ...sq, border: "none", opacity: 0.35 }}>↪</button>
    <div className="sep" />
    <span style={{ flex: 1 }} />
    <button style={{ ...sq, width: "auto", padding: "0 12px", opacity: 0.4 }}>New</button>
    <button style={{ ...sq, width: "auto", padding: "0 12px", color: "#c0c0c0" }}>Save</button>
    <button style={{ ...sq, width: "auto", padding: "0 12px", color: "#c0c0c0" }}>Load</button>
  </div><div className="vp" /></div>);
}

const OPTIONS = [
  ["today", "Today", <span><b>Today.</b> Every item is a separate boxed button in one undifferentiated row; the autosave text wraps; New is disabled-grey; Save and Load are the only labelled buttons and they're the ones you use least.</span>, BarToday],
  ["a", "A · Clustered", <span><b>A · Clustered.</b> Same items, three zones: <i>where am I</i> (brand · project / scene breadcrumb · save dot), <i>view</i> (a FLOOR segmented control + Top), <i>do</i> (undo/redo · Save · Play · ⋯). Click the scene for its menu (★ entry, new, delete), the project for its menu. Hover for tooltips with shortcuts.</span>, BarA],
  ["b", "B · Command bar", <span><b>B · Command bar.</b> Logo mark + breadcrumb only on the left; ONE primary button (Play); floors collapse into a <i>Floor G ▾</i> menu; the save state is a pill that turns amber and becomes the Save button when dirty ("Unsaved · Save now"). File actions live behind ⋯.</span>, BarB],
  ["c", "C · Scene tabs", <span><b>C · Scene tabs.</b> Scenes are tabs along the bar (★ marks the entry scene, an amber dot marks unsaved), + adds one. Everything else is icons on the right. Best when you hop between scenes a lot.</span>, BarC],
  ["d", "D · Icon bar", <span><b>D · Icon bar.</b> Text-free: every action is an icon with a hover tooltip + shortcut; project / scene is one compact menu button; save state is a dot that turns amber (and the Save icon does too). Maximum room, minimum reading.</span>, BarD],
  ["f", "F · B + Save + Top", <span><b>F · Command bar, with A's Save button and a labelled Top.</b> B's left side (logo mark · breadcrumb) plus a small save status; B's Floor menu; the Top button says <i>Top</i>; A's explicit <i>Save</i> button (turns amber when dirty) sits before the primary Play; ⋯ for file actions.</span>, BarF],
  ["e", "E · Two tiers", <span><b>E · Two tiers.</b> A slim top row for the project (brand · breadcrumb · save state · New / Load / Save / Export / help) and a second row for editing (floors, Top view, Undo / Redo, Play project). Costs ~24px of height, buys total clarity and labels everywhere.</span>, BarE],
];
function App() {
  const [view, setView] = useState("f"); const [key, setKey] = useState(0);
  return (
    <div className="page">
      <div className="topbar">
        <span className="lbl">TOP BAR PROTOTYPE</span>
        <button className={"btn" + (view === "all" ? " primary" : "")} onClick={() => setView("all")}>all</button>
        {OPTIONS.map(([k, l]) => <button key={k} className={"btn" + (view === k ? " primary" : "")} onClick={() => setView(k)}>{l}</button>)}
        <span style={{ flex: 1 }} />
        <button className="btn" onClick={() => setKey(k => k + 1)}>reset</button>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 34 }} key={key}>
        {OPTIONS.filter(([k]) => view === "all" || view === k).map(([k, l, note, B]) => <div key={k}><div className="note">{note}</div><B /></div>)}
      </div>
    </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
