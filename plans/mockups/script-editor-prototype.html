<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Script editor prototype — A…G</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --bg: #0f1115; --panel: rgba(28,28,28,0.97); --line: rgba(255,255,255,0.08); --text: #dde3f0; --text2: #c2cadb; --muted: #8b94a8; --blue: #80aaff; --amber: #e8c14b; --red: #cc6666; --green: #44cc88; }
  body { margin: 0; background: var(--bg); color: var(--text2); font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  * { box-sizing: border-box; }
  .stage { display: flex; flex-wrap: wrap; gap: 28px; padding: 24px; align-items: flex-start; }
  .opt { display: flex; flex-direction: column; }
  .note { color: var(--muted); font-size: 11px; line-height: 1.5; max-width: 340px; padding: 0 0 8px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .note b { color: var(--blue); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; min-height: 720px; position: relative; }
  .ph { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 8px; }
  .ph .t { color: var(--text); font-size: 13px; letter-spacing: 1px; }
  .tabs { display: flex; padding: 0 4px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .tab { padding: 6px 8px; font-size: 11px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tab.on { color: var(--text); border-bottom-color: var(--blue); }
  .back { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .back .b { width: 36px; height: 26px; border-radius: 4px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; color: #c0c0c0; }
  .back .name { color: var(--text); flex: 1; }
  .btn { padding: 4px 8px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; color: #c0c0c0; font-size: 11px; cursor: pointer; font-family: inherit; }
  .btn:hover { background: rgba(255,255,255,0.12); color: var(--text); }
  .btn.amber { color: var(--amber); } .btn.danger { color: var(--red); } .btn.primary { background: rgba(80,140,255,0.25); padding: 6px 12px; }
  .field, select.field, input.field { background: rgba(46,46,46,0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: #d4d8e2; font-size: 12px; padding: 6px 8px; font-family: inherit; width: 100%; outline: none; }
  input.field:focus, select.field:focus { border-color: rgba(80,140,255,0.5); }
  .lbl { color: var(--muted); font-size: 9px; letter-spacing: 0.5px; text-transform: uppercase; }
  .sec { color: var(--muted); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .dim { color: var(--muted); } .amber { color: var(--amber); } .blue { color: var(--blue); }
  .sans { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .toggle { display: flex; align-items: center; gap: 6px; padding: 6px 0; cursor: pointer; color: #d4d8e2; }
  .toggle .box { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.2); background: rgba(46,46,46,0.9); }
  .toggle .box.on { background: #3b6fe0; border-color: #3b6fe0; }
  .edit { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 8px; padding: 6px 8px 10px; }
  .edit.cols3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .edit .f { display: flex; flex-direction: column; gap: 3px; }
  .edit.cond { margin: 2px 8px 6px; background: rgba(80,140,255,0.06); outline: 1px solid rgba(80,140,255,0.3); border-radius: 4px; }
  .menu { position: absolute; z-index: 5; background: rgba(28,28,28,0.99); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 3px; display: flex; flex-direction: column; min-width: 200px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
  .menu button { text-align: left; background: none; border: none; color: var(--text2); padding: 6px 8px; font-size: 11px; cursor: pointer; border-radius: 4px; font-family: inherit; }
  .menu button:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .menu .sep { height: 1px; background: rgba(255,255,255,0.08); margin: 3px 0; }
  .footer { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid rgba(255,255,255,0.06); margin-top: auto; }
  .topbar { display: flex; gap: 6px; align-items: center; padding: 12px 24px 0; flex-wrap: wrap; }
  .topbar .lbl { font-size: 11px; letter-spacing: 1px; }
  /* field styles (switchable from the top bar) */
  .edit.rows { display: flex; flex-direction: column; gap: 0; padding: 2px 12px 8px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .frow { display: flex; align-items: center; gap: 10px; min-height: 36px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .frow:last-child { border-bottom: none; }
  .frow .fl { color: #98a2b8; font-size: 12px; flex: 1; }
  .frow .fc { display: flex; align-items: center; gap: 6px; }
  .selx { position: relative; display: inline-flex; align-items: center; }
  .selx select { appearance: none; -webkit-appearance: none; background: transparent; border: none; color: var(--text); font: inherit; font-size: 13px; padding: 4px 18px 4px 6px; cursor: pointer; text-align: right; direction: rtl; border-radius: 6px; max-width: 170px; }
  .selx select option { direction: ltr; }
  .selx select:hover { background: rgba(255,255,255,0.06); } .selx select:focus { outline: none; background: rgba(80,140,255,0.1); }
  .selx .chev { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; display: flex; }
  input.num { width: 68px; text-align: right; background: rgba(255,255,255,0.05); border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; color: var(--text); font: inherit; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  input.num:focus { border-color: rgba(80,140,255,0.5); background: rgba(80,140,255,0.08); outline: none; }
  input.txt { width: 150px; text-align: right; background: rgba(255,255,255,0.05); border: 1px solid transparent; border-radius: 6px; padding: 5px 8px; color: var(--text); font: inherit; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  input.txt:focus { border-color: rgba(80,140,255,0.5); background: rgba(80,140,255,0.08); outline: none; }
  .unit { color: var(--muted); font-size: 11px; }
  .sw { width: 34px; height: 20px; border-radius: 10px; background: rgba(255,255,255,0.14); position: relative; cursor: pointer; transition: background .15s; flex-shrink: 0; }
  .sw.on { background: #3b82f6; } .sw .k { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,0.4); } .sw.on .k { left: 16px; }
  .edit.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 10px 10px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .fchip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); font-size: 12px; color: #98a2b8; position: relative; }
  .fchip:hover { border-color: rgba(255,255,255,0.2); }
  .fchip b { color: var(--text); font-weight: 600; font-family: ui-monospace, Menlo, monospace; }
  .fchip .ov { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .fchip.tg { cursor: pointer; } .fchip.tg.on { background: rgba(80,140,255,0.16); border-color: rgba(80,140,255,0.4); color: var(--blue); } .fchip.tg.on b { color: var(--blue); }
  .fchip input.inl { background: transparent; border: none; color: var(--text); font: inherit; font-family: ui-monospace, Menlo, monospace; font-weight: 600; outline: none; border-bottom: 1px dotted rgba(255,255,255,0.35); padding: 0; }
  .fchip input.inl:focus { border-bottom-color: var(--blue); }
  .edit.props { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px 10px; align-items: center; padding: 8px 12px 10px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .edit.props .pi { color: var(--muted); display: flex; }
  .edit.props .pl { color: #98a2b8; font-size: 12px; }
  .edit.props .pctl { justify-self: end; display: flex; align-items: center; gap: 8px; }
  .rng { -webkit-appearance: none; appearance: none; width: 96px; height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; outline: none; }
  .rng::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--blue); cursor: pointer; border: 2px solid #1a1a1a; }
  .pv { font-family: ui-monospace, Menlo, monospace; color: var(--text); min-width: 38px; text-align: right; font-size: 12px; }
  .edit.rows .f, .edit.chips .f, .edit.props .f { display: contents; }
  .edit.rows .btn.danger, .edit.chips .btn.danger, .edit.props .btn.danger { margin-top: 6px; }
  .edit.props .btn.danger { grid-column: 1 / -1; justify-self: end; }
  /* editable prose cue + trigger chips */
  .ed { cursor: pointer; border-bottom: 1px dotted rgba(221,227,240,0.35); }
  .ed:hover { border-bottom-color: var(--blue); color: var(--text); }
  .ed.on { color: var(--blue); border-bottom-color: var(--blue); }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; padding: 2px 7px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.14); color: var(--muted); cursor: pointer; background: rgba(255,255,255,0.03); }
  .chip:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
  .chip.on { color: var(--blue); border-color: rgba(80,140,255,0.5); background: rgba(80,140,255,0.1); }
  .chip.amber { color: var(--amber); border-color: rgba(232,193,75,0.4); }
  /* A/B/C rows + outline */
  .head { padding: 10px 12px 2px; }
  .when { color: var(--text); font-size: 14px; }
  .row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 6px; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  .row:hover { background: rgba(255,255,255,0.04); }
  .row.open { background: rgba(80,140,255,0.08); outline: 1px solid rgba(80,140,255,0.3); }
  .row .verb { color: #98a2b8; white-space: nowrap; }
  .row .noun { color: var(--text); }
  .row .tail { color: var(--muted); font-size: 11px; margin-left: auto; }
  .row .ctl { display: none; gap: 2px; margin-left: 4px; }
  .row:hover .ctl, .row.open .ctl { display: flex; }
  .ctl button { background: none; border: none; padding: 0 4px; color: var(--muted); font-size: 11px; border-radius: 3px; cursor: pointer; font-family: inherit; }
  .ctl button:hover { background: rgba(255,255,255,0.08); color: var(--text); }
  .ctl .x:hover { color: var(--red); } .ctl .if { color: var(--amber); }
  .brule { display: flex; align-items: baseline; gap: 8px; padding: 8px 8px 4px; flex-wrap: wrap; }
  .brule .tri, .brule .w { color: var(--amber); cursor: pointer; }
  .brule .tri { width: 10px; font-size: 10px; }
  .brule .w { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
  .brule .tri:hover, .brule .w:hover { color: #f3d97a; }
  .brule .n { color: var(--muted); font-size: 11px; margin-left: auto; }
  .branch { border-left: 1px solid rgba(232,193,75,0.25); margin-left: 12px; padding-left: 4px; }
  .card { margin: 4px 0; background: rgba(232,193,75,0.05); border: 1px solid rgba(232,193,75,0.3); border-radius: 4px; padding: 4px 6px 6px; }
  .add { color: var(--muted); font-size: 11px; padding: 4px 8px; opacity: 0.6; cursor: pointer; background: none; border: none; font-family: inherit; }
  .add:hover { opacity: 1; color: var(--text); } .add.amber { color: var(--amber); }
  .condline { display: flex; gap: 8px; padding: 2px 12px 6px; align-items: baseline; flex-wrap: wrap; }
  .condline .k { color: var(--muted); font-size: 11px; width: 64px; }
  .list { width: 176px; border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; }
  .li { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
  .li:hover { background: rgba(255,255,255,0.03); } .li.on { background: rgba(80,140,255,0.10); }
  .li .n { color: var(--text); } .li .s { color: var(--muted); font-size: 10px; margin-top: 2px; line-height: 1.35; }
  /* D prose */
  .p { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; line-height: 2.1; color: #98a2b8; padding: 10px 14px; }
  .pc { display: inline-block; padding: 0 7px; border-radius: 4px; background: rgba(46,46,46,0.9); border: 1px solid rgba(255,255,255,0.1); color: var(--text); font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 22px; cursor: pointer; vertical-align: baseline; }
  .pc:hover { border-color: rgba(80,140,255,0.5); } .pc.on { background: rgba(80,140,255,0.18); border-color: rgba(80,140,255,0.5); color: var(--blue); }
  .pc.amber { color: var(--amber); } .pc.k { color: #98a2b8; background: transparent; border-color: transparent; }
  .pins { color: var(--muted); opacity: 0.55; font-size: 12px; cursor: pointer; border: none; background: none; font-family: inherit; }
  .pins:hover { opacity: 1; color: var(--text); }
  /* E cards */
  .E { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
  .E .hero { margin: 12px 12px 8px; padding: 12px; border-radius: 10px; background: linear-gradient(180deg, rgba(80,140,255,0.14), rgba(80,140,255,0.05)); border: 1px solid rgba(80,140,255,0.25); display: flex; gap: 10px; align-items: flex-start; }
  .E .hero .ic { width: 34px; height: 34px; border-radius: 9px; background: rgba(80,140,255,0.2); color: var(--blue); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .E .hero .ttl { color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; }
  .E .hero .ttl:hover { color: var(--blue); }
  .E .grp { margin: 6px 12px; border-radius: 10px; border: 1px solid rgba(232,193,75,0.3); overflow: hidden; }
  .E .grp .gh { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: rgba(232,193,75,0.08); border-bottom: 1px solid rgba(232,193,75,0.2); }
  .E .grp .gh.else { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.08); border-top: 1px solid rgba(255,255,255,0.08); }
  .E .grp .gh .w { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--amber); }
  .E .grp .gh.else .w { color: var(--muted); }
  .E .grp .gh .c { color: var(--text); font-family: ui-monospace, Menlo, monospace; font-size: 12px; cursor: pointer; }
  .E .grp .gh .c:hover { color: var(--blue); }
  .E .grp .gb { padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  .E .ac { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); cursor: pointer; position: relative; }
  .E .ac:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.14); }
  .E .ac.open { border-color: rgba(80,140,255,0.5); background: rgba(80,140,255,0.08); }
  .E .ac .ic { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .E .ac .ttl { color: var(--text); font-weight: 600; font-size: 13px; }
  .E .ac .sub { color: var(--muted); font-size: 11px; margin-top: 1px; font-family: ui-monospace, Menlo, monospace; }
  .E .ac .kb { margin-left: auto; color: var(--muted); font-size: 16px; padding: 0 4px; border-radius: 4px; opacity: 0; }
  .E .ac:hover .kb, .E .ac.open .kb { opacity: 1; }
  .E .ac .kb:hover { background: rgba(255,255,255,0.1); color: var(--text); }
  .E .addc { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.14); color: var(--muted); cursor: pointer; font-size: 12px; }
  .E .addc:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
  .E .edit { padding: 6px 12px 12px; }
  .E .edit .lbl { font-family: system-ui, sans-serif; font-size: 10px; letter-spacing: 0.3px; text-transform: none; color: #98a2b8; }
  .E .field { border-radius: 6px; }
  /* F flow */
  .F { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; }
  .F .flow { padding: 12px 12px 16px; position: relative; }
  .F .node { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 22px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); cursor: pointer; position: relative; }
  .F .node:hover { border-color: rgba(255,255,255,0.25); }
  .F .node.open { border-color: rgba(80,140,255,0.5); background: rgba(80,140,255,0.08); }
  .F .node .ic { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .F .node .t { color: var(--text); font-weight: 600; }
  .F .node .s { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  .F .trig { background: rgba(80,140,255,0.12); border-color: rgba(80,140,255,0.35); }
  .F .link { width: 2px; height: 14px; background: rgba(255,255,255,0.14); margin-left: 22px; }
  .F .dec { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; background: rgba(232,193,75,0.09); border: 1px solid rgba(232,193,75,0.35); position: relative; }
  .F .dec .dia { width: 18px; height: 18px; transform: rotate(45deg); background: rgba(232,193,75,0.25); border: 1px solid var(--amber); border-radius: 3px; flex-shrink: 0; }
  .F .dec .c { color: var(--text); font-family: ui-monospace, Menlo, monospace; font-size: 12px; cursor: pointer; flex: 1; }
  .F .dec .c:hover { color: var(--blue); }
  .F .lanes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .F .lane { border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); padding: 6px; display: flex; flex-direction: column; gap: 6px; background: rgba(255,255,255,0.02); }
  .F .lane .lh { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 2px 4px; }
  .F .lane.yes .lh { color: var(--green); } .F .lane.no .lh { color: var(--red); }
  .F .lane .node { padding: 6px 8px; border-radius: 8px; }
  .F .lane .node .s { display: none; }
  .F .lane .node.open .s { display: block; }
  .F .mini { color: var(--muted); font-size: 11px; padding: 4px; text-align: center; border-radius: 6px; border: 1px dashed rgba(255,255,255,0.12); cursor: pointer; }
  .F .mini:hover { color: var(--text); }
  .F .pop { margin: 6px 0; padding: 4px; border-radius: 8px; background: rgba(28,28,28,0.99); border: 1px solid rgba(80,140,255,0.35); }
  /* G grid */
  .G { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; }
  .G .tb { display: flex; gap: 4px; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.06); align-items: center; }
  .G .tb .btn { display: inline-flex; gap: 4px; align-items: center; }
  .G table { width: 100%; border-collapse: collapse; }
  .G th { text-align: left; color: var(--muted); font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 600; }
  .G td { padding: 5px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; font-family: ui-monospace, Menlo, monospace; }
  .G tr.r:hover td { background: rgba(255,255,255,0.03); }
  .G tr.g td { background: rgba(232,193,75,0.07); color: var(--amber); font-family: system-ui, sans-serif; font-weight: 600; font-size: 11px; }
  .G tr.g.else td { background: rgba(255,255,255,0.04); color: var(--muted); }
  .G tr.g td .c { color: var(--text); font-family: ui-monospace, Menlo, monospace; font-weight: 400; cursor: pointer; }
  .G tr.g td .c:hover { color: var(--blue); }
  .G td.cell { cursor: text; color: var(--text); }
  .G td.cell:hover { outline: 1px solid rgba(80,140,255,0.4); outline-offset: -1px; }
  .G td.num { color: var(--muted); width: 26px; text-align: right; }

<script type="text/babel">

const ACTION_TYPES = Object.keys(ACTIONS);

const TRIGGERS = { on_timer: "every N seconds", on_player_enter: "when the player enters", on_player_exit: "when the player leaves", on_interact: "when the player interacts", on_game_start: "on game start", on_state_equals: "when a state becomes a value" };

const condText = (c) => {

// ═══ icons (inline SVG, 16px, stroke) ═══
function Icon({ name, size = 16 }) {

// ═══ shared editors ═══
const FieldStyle = React.createContext("boxed");
const RANGES = { volume: [0, 4, 0.1], blend: [0, 2, 0.05], delay: [0, 5, 0.1], fade: [0, 3, 0.1], interval: [0.5, 30, 0.5] };

        {kind === "select" && <span className="selx"><select value={value} onChange={e => onChange(e.target.value)}>{options.map(o => <option key={o} value={o}>{lab(o)}</option>)}</select><Chev /></span>}
        {kind === "number" && range && <React.Fragment><input type="range" className="rng" min={range[0]} max={range[1]} step={range[2]} value={value === "" ? range[0] : value} onChange={num} /><span className="pv">{value}{/s\)/.test(label) ? "s" : ""}</span></React.Fragment>}
        {kind === "number" && !range && <input className="num" value={value ?? ""} inputMode="decimal" onChange={num} />}
        {kind === "text" && <input className="txt" value={value ?? ""} onChange={e => onChange(e.target.value)} />}

const useEditClass = (cols3) => { const st = React.useContext(FieldStyle); return st === "boxed" ? "edit" + (cols3 ? " cols3" : "") : "edit " + st; };

      {c.type !== "player_falling" && c.type !== "has_item" && <Field def={["scope","Whose state","select",SCOPES]} value={c.scope} onChange={v => onChange({ ...c, scope: v })} />}
      {c.type !== "player_falling" && <Field def={["key", c.type === "has_item" ? "Item" : "State key", "text"]} value={c.key} onChange={v => onChange({ ...c, key: v })} />}

    <div className="chips">
      {t.type === "on_timer" && <span className={"chip" + (t.repeat ? " on" : "")} title="Does the timer keep firing? Click to toggle" onClick={() => set({ repeat: !t.repeat })}>{t.repeat ? `timer repeats every ${t.interval}s` : "timer fires once"}</span>}

// ═══ shared script operations (one open-editor key per panel) ═══
function useScriptOps(script, setScript, openState) {
  const [open, setOpen] = openState;
  const isOpen = (k) => open === k;
  const toggleOpen = (k) => setOpen(open === k ? null : k);
  const patch = (id, na, mode) => setScript(s => ({ ...s, actions: mode === "dup"
    ? s.actions.flatMap(x => x.id === id ? [x, { ...na, block: x.block }] : [x])
    : s.actions.map(x => x.id === id ? na : x) }));
  const del = (id) => setScript(s => ({ ...s, actions: s.actions.filter(x => x.id !== id) }));
  const add = (tag) => { const id = uid("a"); setScript(s => ({ ...s, actions: [...s.actions, { id, type: "set_state", delay: 0, ...NEW_ACTION.set_state, ...(tag ? { block: tag } : {}) }] })); setOpen(id); };
  const wrap = (id) => { const bid = uid("blk"); setScript(s => ({ ...s, blocks: [...s.blocks, { id: bid, branches: [{ conditions: [BLANK_COND()] }] }],
    actions: s.actions.map(x => x.id === id ? { ...x, block: { id: bid, branch: 0 } } : x) })); setOpen(`cond:${bid}:0:0`); };
  const move = (id, tag) => setScript(s => ({ ...s, actions: s.actions.map(x => { if (x.id !== id) return x; const { block, ...rest } = x; return tag ? { ...rest, block: tag } : rest; }) }));
  const addBlock = () => { const bid = uid("blk"); setScript(s => ({ ...s, blocks: [...s.blocks, { id: bid, branches: [{ conditions: [BLANK_COND()] }] }] })); setOpen(`cond:${bid}:0:0`); };
  const patchBlock = (nb) => setScript(s => ({ ...s, blocks: s.blocks.map(b => b.id === nb.id ? nb : b) }));

  const removeBranch = (b, j) => { patchBlock({ ...b, branches: b.branches.filter((_, i) => i !== j) }); untag(x => x.block?.id === b.id && x.block.branch === j); };
  const removeElse = (b) => { patchBlock({ ...b, else: false }); untag(x => x.block?.id === b.id && x.block.branch === -1); };
  const addBranch = (b) => patchBlock({ ...b, branches: [...b.branches, { conditions: [BLANK_COND()] }] });
  const addElse = (b) => patchBlock({ ...b, else: true });

    ...b.branches.map((br, j) => ({ label: `${j === 0 ? "if" : "else if"} ${br.conditions.map(condText).join(" and ") || "(always)"}`, tag: { id: b.id, branch: j } })),

}
function RowMenu({ a, ops, onClose, extra }) {

    <div className="menu" style={{ right: 8, top: 28 }} onMouseLeave={onClose} onClick={e => e.stopPropagation()}>

      {ops.moveTargets(a).map(t => <button key={t.label} onClick={() => { onClose(); ops.move(a.id, t.tag); }}>{t.label}</button>)}

// ═══ A · B · C building blocks (sentence rows / outline) ═══
function ActionRow({ a, ops, cols3 }) {
  const { verb, noun, tail } = sentence(a);

    <div style={{ position: "relative" }}>
      <div className={"row" + (open ? " open" : "")} onClick={() => ops.toggleOpen(a.id)}>

        <span className="ctl" onClick={e => e.stopPropagation()}>
          {!a.block && <button className="if" title="Wrap in an if-block" onClick={() => ops.wrap(a.id)}>if</button>}
          <button title="Move to…" onClick={() => setMenu(m => !m)}>⇄</button>
          <button title="Duplicate" onClick={() => ops.patch(a.id, { ...a, id: uid("a") }, "dup")}>⧉</button>
          <button className="x" title="Delete" onClick={() => ops.del(a.id)}>×</button>

      </div>

function Rows({ script, ops, filter, cols3 }) { return script.actions.filter(filter).map(a => <ActionRow key={a.id} a={a} ops={ops} cols3={cols3} />); }
function CondSentence({ c, k, ops, onChange, onDelete, cols3 }) {

      <button className="add" style={{ padding: "0 4px" }} onClick={() => { ops.setConds(b, j, [...br.conditions, BLANK_COND()]); ops.setOpen(`cond:${b.id}:${j}:${br.conditions.length}`); }}>+ and</button>

function TriggerHead({ script, setScript, ops, cols3 }) {

function Outline({ script, setScript, ops, cols3, collapsed, setCollapsed }) {

            {b.else && rule("else", -1)}

      <div style={{ flex: 1, minWidth: 0 }}>
        <div className="ttl" onClick={() => ops.toggleOpen("trig")}>{triggerText(t, script.owner)}</div>
        <div className="sub" style={{ color: "var(--muted)", fontSize: 11 }}>on ★ {script.owner}</div>
        <TriggerChips script={script} setScript={setScript} editorOpen={ops.isOpen("trig")} onOpenEditor={() => ops.toggleOpen("trig")} />
      </div>
    </div>
    {ops.isOpen("trig") && <TriggerEditor script={script} setScript={setScript} style={{ margin: "0 12px 6px" }} />}
    {script.conditions.length > 0 && <div style={{ padding: "2px 14px 6px", fontSize: 12 }}><span className="dim">only when </span>{script.conditions.map((c, i) => <span key={i}>{i > 0 && " and "}<span className="ed" onClick={() => ops.toggleOpen("sc:" + i)}>{condText(c)}</span></span>)}</div>}
    {script.blocks.map((b) => (
      <div className="grp" key={b.id}>
        {b.branches.map((br, j) => (<div key={j}>{condHead(b, j, j === 0 ? "IF" : "ELSE IF")}{condEditor(b, j)}
          <div className="gb">{script.actions.filter(ops.inBranch(b, j)).map(a => <CardAction key={a.id} a={a} ops={ops} />)}<div className="addc" onClick={() => ops.add({ id: b.id, branch: j })}><Icon name="plus" /> action</div></div></div>))}
        {b.else && <div>{condHead(b, -1, "ELSE", "else")}<div className="gb">{script.actions.filter(ops.inBranch(b, -1)).map(a => <CardAction key={a.id} a={a} ops={ops} />)}<div className="addc" onClick={() => ops.add({ id: b.id, branch: -1 })}><Icon name="plus" /> action</div></div></div>}
        <div style={{ display: "flex", gap: 6, padding: "4px 8px 8px", background: "rgba(255,255,255,0.02)" }}>
          <span className="pins" onClick={() => ops.addBranch(b)}>+ else if</span>{!b.else && <span className="pins" onClick={() => ops.addElse(b)}>+ else</span>}<span style={{ flex: 1 }}></span><span className="pins" onClick={() => ops.unwrap(b.id)}>unwrap</span>
        </div>
      </div>))}
    <div style={{ padding: "0 12px", display: "flex", flexDirection: "column", gap: 6 }}>
      {script.actions.filter(a => !a.block).map(a => <CardAction key={a.id} a={a} ops={ops} />)}
      <div style={{ display: "flex", gap: 6 }}><div className="addc" style={{ flex: 1 }} onClick={() => ops.add()}><Icon name="plus" /> action</div><div className="addc" style={{ flex: 1, color: "var(--amber)" }} onClick={ops.addBlock}><Icon name="branch" /> if-block</div></div>
    </div>
    <Footer />
  </Chrome>);
}
// ═══ F · Flow ═══
function FlowNode({ a, ops, small }) {
  const spec = ACTIONS[a.type]; const s = sentence(a); const open = ops.isOpen(a.id); const [menu, setMenu] = useState(false);
  return (<div>
    <div className={"node" + (open ? " open" : "")} onClick={() => ops.toggleOpen(a.id)}>
      <div className="ic" style={{ background: spec.tint + "22", color: spec.tint }}><Icon name={spec.icon} size={14} /></div>
      <div style={{ minWidth: 0 }}><div className="t">{spec.verb} <span style={{ fontWeight: 400 }}>{s.noun}</span></div>{s.tail && <div className="s">{s.tail}</div>}</div>
      <span className="kb dim" style={{ marginLeft: "auto" }} onClick={e => { e.stopPropagation(); setMenu(m => !m); }}><Icon name="dots" /></span>
      {menu && <RowMenu a={a} ops={ops} onClose={() => setMenu(false)} />}
    </div>
    {open && <div className="pop"><ActionEditor a={a} onChange={na => ops.patch(a.id, na)} /></div>}
  </div>);
}
function PanelF() {
  const [script, setScript] = useState(SPIKES); const ops = useScriptOps(script, setScript, useState("a1")); const t = script.trigger;
  const lane = (b, j, cls, label) => (
    <div className={"lane " + cls}><div className="lh">{label}</div>
      {script.actions.filter(ops.inBranch(b, j)).map(a => <FlowNode key={a.id} a={a} ops={ops} small />)}
      <div className="mini" onClick={() => ops.add({ id: b.id, branch: j })}>+ step</div>
    </div>);
  return (<Chrome width={440} title={script.label} className="F">
    <div className="flow">
      <div className={"node trig" + (ops.isOpen("trig") ? " open" : "")} onClick={() => ops.toggleOpen("trig")}>
        <div className="ic" style={{ background: "rgba(80,140,255,0.25)", color: "var(--blue)" }}><Icon name={t.type === "on_timer" ? "clock" : "enter"} size={14} /></div>
        <div><div className="t">{triggerText(t, script.owner)}</div><div className="s">on ★ {script.owner}</div></div>
      </div>
      <div onClick={e => e.stopPropagation()} style={{ paddingLeft: 6 }}><TriggerChips script={script} setScript={setScript} editorOpen={ops.isOpen("trig")} onOpenEditor={() => ops.toggleOpen("trig")} /></div>
      {ops.isOpen("trig") && <div className="pop"><TriggerEditor script={script} setScript={setScript} /></div>}
      {script.blocks.map((b) => {
        const br = b.branches[0];
        return (<div key={b.id}>
          <div className="link"></div>
          <div className="dec"><div className="dia"></div>
            <span className="c" onClick={() => ops.toggleOpen(`cond:${b.id}:0:0`)}>{br.conditions.map(condText).join(" and ") || "(always)"}</span>
            <span className="pins" onClick={() => ops.unwrap(b.id)} title="Remove the decision (steps move up)">×</span>
          </div>
          {ops.isOpen(`cond:${b.id}:0:0`) && br.conditions[0] && <div className="pop"><CondEditor c={br.conditions[0]} onChange={nc => ops.setConds(b, 0, br.conditions.map((x, q) => q === 0 ? nc : x))} /></div>}
          <div className="lanes">{lane(b, 0, "yes", "yes")}{b.else ? lane(b, -1, "no", "no") : <div className="lane no"><div className="lh">no</div><div className="mini" onClick={() => ops.addElse(b)}>+ else steps</div></div>}</div>
          {b.branches.length > 1 && <div className="dim" style={{ fontSize: 10, padding: "4px 2px" }}>+ {b.branches.length - 1} else-if branch{b.branches.length > 2 ? "es" : ""} (shown in the outline view)</div>}
        </div>);
      })}
      {script.actions.filter(a => !a.block).map(a => <div key={a.id}><div className="link"></div><FlowNode a={a} ops={ops} /></div>)}
      <div className="link"></div>
      <div style={{ display: "flex", gap: 6 }}><div className="mini" style={{ flex: 1 }} onClick={() => ops.add()}>+ step</div><div className="mini" style={{ flex: 1, color: "var(--amber)" }} onClick={ops.addBlock}>+ decision</div></div>
    </div>
    <Footer />
  </Chrome>);
}
// ═══ G · Grid ═══
function Cell({ value, onChange, options, width }) {
  const [ed, setEd] = useState(false);
  if (!ed) return <td className="cell" style={{ width }} onClick={() => setEd(true)}>{String(value ?? "")}</td>;
  if (options) return <td style={{ width }}><select autoFocus className="cellin" value={value} onBlur={() => setEd(false)} onChange={e => { onChange(e.target.value); setEd(false); }}>{options.map(o => <option key={o} value={o}>{lab(o)}</option>)}</select></td>;
  return <td style={{ width }}><input autoFocus className="cellin" defaultValue={value ?? ""} onBlur={e => { onChange(e.target.value); setEd(false); }} onKeyDown={e => { if (e.key === "Enter") e.target.blur(); if (e.key === "Escape") setEd(false); }} /></td>;
}
function GridRow({ a, ops, n, indent }) {
  const spec = ACTIONS[a.type]; const s = sentence(a); const [menu, setMenu] = useState(false);
  const primary = spec.fields.find(f => f[0] === "key") ?? spec.fields[0]; const num = (v) => v === "" ? 0 : Number(v);
  return (<tr className="r">
    <td className="num">{n}</td>
    <td style={{ width: 118, position: "relative" }}>{indent && <span className="ind"></span>}<span style={{ color: spec.tint }}><Icon name={spec.icon} size={12} /></span> <span style={{ color: "var(--text)" }}>{spec.verb}</span></td>
    <Cell value={a[primary[0]]} options={primary[2] === "select" ? primary[3] : undefined} onChange={v => ops.patch(a.id, { ...a, [primary[0]]: v })} />
    <td className="dim" style={{ fontSize: 11 }}>{s.tail.replace(/ · after .*$/, "")}</td>
    <Cell value={a.delay} width={52} onChange={v => ops.patch(a.id, { ...a, delay: num(v) })} />
    <td style={{ width: 28, position: "relative" }}><div className="rowctl"><button onClick={() => setMenu(m => !m)}>⋯</button></div>{menu && <RowMenu a={a} ops={ops} onClose={() => setMenu(false)} />}</td>
  </tr>);
}
function PanelG() {
  const [script, setScript] = useState(SPIKES); const ops = useScriptOps(script, setScript, useState("a1")); const t = script.trigger;
  let n = 0;
  const groupRow = (b, j, word, cls) => { const br = j >= 0 ? b.branches[j] : null; return (
    <tr className={"g " + (cls || "")} key={"g" + j}><td colSpan={6}>
      <span style={{ marginRight: 8 }}>{word}</span>
      {br && br.conditions.map((c, i) => <span key={i}>{i > 0 && <span className="dim"> and </span>}<span className={"c" + (ops.isOpen(`cond:${b.id}:${j}:${i}`) ? " blue" : "")} onClick={() => ops.toggleOpen(`cond:${b.id}:${j}:${i}`)}>{condText(c)}</span></span>)}
      {br && <span className="pins" style={{ marginLeft: 6 }} onClick={() => { ops.setConds(b, j, [...br.conditions, BLANK_COND()]); ops.setOpen(`cond:${b.id}:${j}:${br.conditions.length}`); }}>+ and</span>}
      <span style={{ float: "right", display: "flex", gap: 8 }}>
        {j === 0 && <span className="pins" onClick={() => ops.addBranch(b)}>+ else if</span>}{j === 0 && !b.else && <span className="pins" onClick={() => ops.addElse(b)}>+ else</span>}
        <span className="pins" onClick={() => ops.add({ id: b.id, branch: j })}>+ row</span>
        {j === 0 ? <span className="pins" onClick={() => ops.unwrap(b.id)}>unwrap</span> : <span className="pins" onClick={() => j === -1 ? ops.removeElse(b) : ops.removeBranch(b, j)}>×</span>}
      </span>
    </td></tr>); };
  const condEditorRow = (b, j) => { const k = ops.open; if (!k || !k.startsWith(`cond:${b.id}:${j}:`)) return null; const i = +k.split(":")[3]; const br = b.branches[j]; const c = br.conditions[i]; if (!c) return null;
    return <tr key={"ce" + j}><td colSpan={6} style={{ padding: 0 }}><CondEditor c={c} cols3 style={{ margin: 6 }} onChange={nc => ops.setConds(b, j, br.conditions.map((x, q) => q === i ? nc : x))} onDelete={() => ops.setConds(b, j, br.conditions.filter((_, q) => q !== i))} /></td></tr>; };
  return (<Chrome width={520} title={script.label} className="G">
    <div className="tb">
      <span style={{ color: "var(--blue)", display: "inline-flex", gap: 6, alignItems: "center", cursor: "pointer" }} onClick={() => ops.toggleOpen("trig")}><Icon name={t.type === "on_timer" ? "clock" : "enter"} /><b style={{ color: "var(--text)" }}>{triggerText(t, script.owner)}</b></span>
      <TriggerChips script={script} setScript={setScript} editorOpen={ops.isOpen("trig")} onOpenEditor={() => ops.toggleOpen("trig")} />
      <span style={{ flex: 1 }}></span>
      <button className="btn" onClick={() => ops.add()}><Icon name="plus" size={12} /> row</button><button className="btn amber" onClick={ops.addBlock}><Icon name="branch" size={12} /> if</button>
    </div>
    {ops.isOpen("trig") && <TriggerEditor script={script} setScript={setScript} cols3 style={{ margin: "6px 10px 0" }} />}
    <table>
      <thead><tr><th></th><th>Action</th><th>What</th><th>Params</th><th>After</th><th></th></tr></thead>
      <tbody>
        {script.blocks.map((b) => [
          ...b.branches.flatMap((br, j) => [groupRow(b, j, j === 0 ? "IF" : "ELSE IF"), condEditorRow(b, j),
            ...script.actions.filter(ops.inBranch(b, j)).map(a => <GridRow key={a.id} a={a} ops={ops} n={++n} indent />)]),
          ...(b.else ? [groupRow(b, -1, "ELSE", "else"), ...script.actions.filter(ops.inBranch(b, -1)).map(a => <GridRow key={a.id} a={a} ops={ops} n={++n} indent />)] : []),
        ])}
        {script.actions.filter(a => !a.block).map(a => <GridRow key={a.id} a={a} ops={ops} n={++n} />)}
      </tbody>
    </table>
    {ops.open && script.actions.find(a => a.id === ops.open) && <div style={{ margin: "6px 10px" }}><div className="lbl" style={{ padding: "4px 8px 0" }}>all fields — {ACTIONS[script.actions.find(a => a.id === ops.open).type].verb}</div><ActionEditor cols3 a={script.actions.find(a => a.id === ops.open)} onChange={na => ops.patch(na.id, na)} /></div>}
    <div className="dim" style={{ padding: "6px 12px", fontSize: 11 }}>Click a cell to edit it in place · ⋯ on a row for move / duplicate / delete · Enter commits, Esc cancels.</div>
    <Footer />
  </Chrome>);
}

// ═══ App ═══
const OPTIONS = [
  ["a", "A · Sentence rows", <span><b>A · Sentence rows.</b> Today's panel, untouched — only the action rows become one-line sentences (click to edit inline, hover for if · ⇄ · ⧉ · ×).</span>, PanelA],
  ["b", "B · Outline", <span><b>B · Outline.</b> The trigger is the heading; its settings are the chips under it (click <i>repeating</i> / <i>one-shot</i> to toggle, <i>delay</i> or ⋯ for the full form). IF / ELSE are slim rules — click the word to collapse, the condition to edit.</span>, PanelB],
  ["c", "C · Wide pane", <span><b>C · Wide pane.</b> B at 520px with the script list beside it; click a list row to switch. Fields open in three columns.</span>, PanelC],
  ["d", "D · Prose", <span><b>D · Prose.</b> The script is a paragraph. Every chip is a field — click one and its editor opens under the paragraph; <i>+and…</i> / <i>+then…</i> insert into the sentence.</span>, PanelD],
  ["e", "E · Cards", <span><b>E · Cards.</b> App-style: a hero card for the trigger, each action a card with an icon tile, title and subtitle, ⋯ for move / duplicate / delete. Branches are grouped cards with a coloured header strip.</span>, PanelE],
  ["f", "F · Flow", <span><b>F · Flow.</b> Shortcuts-style timeline: trigger node → decision diamond → <i>yes</i> / <i>no</i> lanes side by side → the steps that always run. Click a node to edit it in a popover.</span>, PanelF],
  ["g", "G · Grid", <span><b>G · Grid.</b> Dense and data-first: one row per action, grouped under IF / ELSE header rows; click a cell to edit in place, ⋯ for the row menu, the full field set opens below for the selected row.</span>, PanelG],
];
const FIELD_STYLES = [["boxed", "boxed (today)"], ["rows", "settings rows"], ["chips", "inline chips"], ["props", "properties panel"]];
function App() {
  const [view, setView] = useState("e"); const [key, setKey] = useState(0); const [fs, setFs] = useState("rows");
  return (
    <FieldStyle.Provider value={fs}>
    <div>
      <div className="topbar">
        <span className="lbl">Script editor prototype</span>
        <button className={"btn" + (view === "all" ? " primary" : "")} onClick={() => setView("all")}>all</button>
        {OPTIONS.map(([k, l]) => <button key={k} className={"btn" + (view === k ? " primary" : "")} onClick={() => setView(k)}>{l}</button>)}
        <span style={{ flex: 1 }}></span>
        <button className="btn" onClick={() => setKey(k => k + 1)}>reset data</button>
      </div>
      <div className="topbar" style={{ paddingTop: 6 }}>
        <span className="lbl">Field style</span>
        {FIELD_STYLES.map(([k, l]) => <button key={k} className={"btn" + (fs === k ? " primary" : "")} onClick={() => { setFs(k); setKey(x => x + 1); }}>{l}</button>)}
        <span className="dim" style={{ fontSize: 11, fontFamily: "system-ui" }}>— restyles the form that opens when you click an action, a condition, or the trigger (one is opened for you)</span>
      </div>
      <div className="stage" key={key}>
        {OPTIONS.filter(([k]) => view === "all" || view === k).map(([k, l, note, P]) => <div className="opt" key={k}><div className="note">{note}</div><P /></div>)}
      </div>
    </div>
    </FieldStyle.Provider>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
