<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>World Editor</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      body { background: #0a0e16; font-family: system-ui, sans-serif; }
      /* Every clickable and everything inside it (text, icons, counts) is
         explicitly pointer — nothing inherits its way back to the arrow. */
      button, button *, [role="button"], [role="button"] *, select, label, summary,
      a, a * { cursor: pointer; }
      button:disabled, button:disabled * { cursor: default; }
      /* Row appear/disappear (Properties panel lists): expand down / collapse up,
         so neighbours visibly slide — in a list of identical rows a plain fade
         reads as nothing happening. Applied to an overflow:hidden wrapper;
         90px comfortably exceeds the tallest row, so growth ends at true height. */
      @keyframes wb-row-in  { from { max-height: 0; opacity: 0; } to { max-height: 90px; opacity: 1; } }
      @keyframes wb-row-out { from { max-height: 90px; opacity: 1; } to { max-height: 0; opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
