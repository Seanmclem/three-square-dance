<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>World Editor</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      body { background: #0a0e16; font-family: system-ui, sans-serif; }
      /* Every clickable and everything inside it (text, icons, counts) is
         explicitly pointer — nothing inherits its way back to the arrow. */
      button, button *, [role="button"], [role="button"] *, select, label, summary,
      a, a * { cursor: pointer; }
      button:disabled, button:disabled * { cursor: default; }
      /* Row appear/disappear (Properties panel lists): expand down / collapse up,
         so neighbours visibly slide — in a list of identical rows a plain fade
         reads as nothing happening. Applied to an overflow:hidden wrapper;
         90px comfortably exceeds the tallest row, so growth ends at true height. */
      @keyframes wb-row-in  { from { max-height: 0; opacity: 0; } to { max-height: 90px; opacity: 1; } }
      @keyframes wb-row-out { from { max-height: 90px; opacity: 1; } to { max-height: 0; opacity: 0; } }
      /* Script editor controls (Phase 66) */
      .wb-switch { appearance: none; -webkit-appearance: none; width: 34px; height: 20px; border-radius: 10px; background: rgba(255,255,255,0.14); position: relative; cursor: pointer; margin: 0; flex-shrink: 0; transition: background .15s; outline: none; }
      .wb-switch::before { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.4); transition: left .15s; }
      .wb-switch:checked { background: #3b82f6; } .wb-switch:checked::before { left: 16px; }
      .wb-range { -webkit-appearance: none; appearance: none; width: 90px; height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; outline: none; margin: 0; }
      .wb-range::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #80aaff; cursor: pointer; border: 2px solid #1c1c1c; }
      .wb-menu button:hover { background: rgba(255,255,255,0.06); color: #dde3f0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
