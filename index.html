<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>World Editor</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      body { background: #0a0e16; font-family: system-ui, sans-serif; }
      /* Every clickable and everything inside it (text, icons, counts) is
         explicitly pointer — nothing inherits its way back to the arrow. */
      button, button *, [role="button"], [role="button"] *, select, label, summary,
      a, a * { cursor: pointer; }
      button:disabled, button:disabled * { cursor: default; }
      /* Row appear/disappear flourishes (Properties panel lists). */
      @keyframes wb-row-in  { from { opacity: 0; transform: translateY(-4px) scale(0.97); } }
      @keyframes wb-row-out { to   { opacity: 0; transform: scale(0.95); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
